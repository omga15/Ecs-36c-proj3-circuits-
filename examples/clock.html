<style>
    body {
        font-family: sans-serif;
        margin: 20px;
    }

    .layout {
        display: flex;
        gap: 20px;
        align-items: flex-start;
    }

    #controls {
        width: 180px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .sub-layers {
        display: flex;
        flex-direction: column;
        margin-left: 24px;
        padding-left: 8px;
        border-left: 2px solid #ccc;
    }

    .sub-layers label {
        font-size: 0.9em;
    }

    #viewer {
        flex: 1;
        min-width: 0;
        border: 1px solid #ccc;
    }

    #viewer svg {
        display: block;
        width: 100%;
        height: auto;
    }
    .layer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
    }

    .layer-header label {
        cursor: pointer;
    }

    .expand-button {
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 12px;
        padding: 4px 8px;
    }

    .expand-button:hover {
        color: #007bff;
    }
.disabled {
    opacity: 0.4;
    pointer-events: none;
    cursor: not-allowed;
}
</style>

<script>
function toggleLayer(id, visible) {
    document.getElementById(id).style.display = visible ? "inline" : "none";
    const sublayer = document.getElementById(id + '-sublayer')
    if(sublayer){       if(visible){
           sublayer.classList.remove('disabled');    // Disable
       }
       else{
           sublayer.classList.add('disabled');    // Enable
       }
    }
}
function toggleSublayer(id, button) {
    const sublayer = document.getElementById(id);
    const isExpanded = sublayer.style.display !== 'none';
    sublayer.style.display = isExpanded ? 'none' : 'flex';
    button.innerHTML = isExpanded ? '&#9660;' : '&#9650;';
    button.setAttribute('aria-expanded', !isExpanded);
}
</script>
